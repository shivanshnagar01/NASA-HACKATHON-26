<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Orbital Care</title>
  <link rel="shortcut icon" href="favicon.svg" type="image/x-icon">
  <style>
    :root {
      --bg: #070a12;
      --sf: #0b101c;
      --ln: rgba(255, 255, 255, .08);
      --tx: #eef1f8;
      --mu: #7d879f;
      --ac: #9bbcff;
      --ok: #6fd6a8;
      --high: #ee8080;
      --f: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif
    }

    * {
      box-sizing: border-box;
      margin: 0
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: radial-gradient(900px 520px at 85% -10%, rgba(80, 120, 255, .12), transparent 70%), radial-gradient(700px 400px at 0 110%, rgba(80, 120, 255, .06), transparent 70%), var(--bg);
      color: var(--tx);
      font-family: var(--f);
      letter-spacing: -.005em;
      -webkit-font-smoothing: antialiased
    }

     ::-webkit-scrollbar{
            display:none;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 26px 32px;
      color: var(--mu);
      font-size: .82rem
    }

    .mark {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: .95rem;
      letter-spacing: .02em;
      color: var(--tx)
    }

    .on {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .on i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--ok)
    }

    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 24px
    }

    .wrap {
      width: 100%;
      max-width: 400px
    }

    .eb {
      font-size: .74rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--mu)
    }

    h1 {
      font-size: clamp(2.4rem, 6vw, 3.4rem);
      font-weight: 200;
      letter-spacing: -.04em;
      line-height: 1.05;
      margin: 16px 0 10px
    }

    .sub {
      color: var(--mu);
      font-size: .95rem;
      line-height: 1.5
    }

    form {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      gap: 22px
    }

    label {
      display: block;
      font-size: .76rem;
      color: var(--mu);
      margin-bottom: 8px
    }

    .f {
      position: relative
    }

    input[type=email],
    input[type=password],
    input[type=text] {
      width: 100%;
      background: var(--sf);
      border: 1px solid var(--ln);
      border-radius: 14px;
      color: var(--tx);
      font: inherit;
      font-size: .98rem;
      padding: 15px 16px;
      transition: border-color .2s, background .2s
    }

    input::placeholder {
      color: #4a536a
    }

    input:hover {
      border-color: rgba(255, 255, 255, .16)
    }

    input:focus {
      outline: none;
      border-color: rgba(155, 188, 255, .6);
      background: #0d1424
    }

    input[aria-invalid=true] {
      border-color: rgba(238, 128, 128, .6)
    }

    .eye {
      position: absolute;
      right: 6px;
      bottom: 6px;
      background: none;
      border: 0;
      color: var(--mu);
      font: inherit;
      font-size: .76rem;
      padding: 10px 12px;
      cursor: pointer;
      border-radius: 10px
    }

    .eye:hover {
      color: var(--tx)
    }

    #pw {
      padding-right: 64px
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: .84rem
    }

    .chk {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--mu);
      cursor: pointer;
      margin: 0;
      font-size: .84rem
    }

    .chk input {
      appearance: none;
      width: 16px;
      height: 16px;
      border: 1px solid rgba(255, 255, 255, .25);
      border-radius: 5px;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: .2s
    }

    .chk input:checked {
      background: var(--ac);
      border-color: var(--ac)
    }

    .chk input:checked::after {
      content: "";
      width: 8px;
      height: 4px;
      border: solid #07101f;
      border-width: 0 0 2px 2px;
      transform: rotate(-45deg) translate(1px, -1px)
    }

    a {
      color: var(--mu);
      text-decoration: none;
      transition: color .2s
    }

    a:hover {
      color: var(--tx)
    }

    a:focus-visible,
    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--ac);
      outline-offset: 3px;
      border-radius: 6px
    }

    .btn {
      margin-top: 6px;
      width: 100%;
      background: var(--tx);
      color: #07101f;
      border: 0;
      border-radius: 14px;
      padding: 15px;
      font: inherit;
      font-weight: 600;
      font-size: .98rem;
      cursor: pointer;
      transition: transform .2s, opacity .2s, background .2s
    }

    .btn:hover {
      background: #fff;
      transform: translateY(-1px)
    }

    .btn[disabled] {
      opacity: .6;
      cursor: wait;
      transform: none
    }

    .err {
      min-height: 1.3em;
      font-size: .84rem;
      color: var(--high)
    }

    .foot {
      margin-top: 36px;
      padding-top: 20px;
      border-top: 1px solid var(--ln);
      color: var(--mu);
      font-size: .8rem;
      line-height: 1.6
    }

    @media (max-width:520px) {
      header {
        padding: 18px
      }

      .wrap {
        max-width: none
      }
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        transition: none !important
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="mark"><svg width="24" height="24" viewBox="0 0 72 72" fill="none" stroke="#9bbcff" stroke-width="5"
        aria-hidden="true">
        <circle cx="36" cy="36" r="14" />
        <ellipse cx="36" cy="38" rx="32" ry="10" transform="rotate(-25 36 38)" />
      </svg>AUHM</div>
    <span class="on"><i></i>System online</span>
  </header>
  <main>
    <div class="wrap">
      <div class="eb">Astronaut Universal Health Monitor</div>
      <h1>Welcome back.</h1>
      <p class="sub">Sign in with your crew account to view your health readings.</p>
      <form id="form" novalidate>
        <div class="f"><label for="email">Crew email</label>
          <input id="email" type="email" autocomplete="username" placeholder="name@mission.space" required>
        </div>
        <div class="f"><label for="pw">Password</label>
          <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••" required>
          <button type="button" class="eye" id="eye" aria-label="Show password" aria-pressed="false">Show</button>
        </div>
        <div class="row">
          <label class="chk"><input type="checkbox" id="rem">Keep me signed in</label>
          <a href="#" id="forgot">Forgot password?</a>
        </div>
        <div class="err" id="err" role="alert" aria-live="assertive"></div>
        <button class="btn" id="go" type="submit">Sign in</button>
      </form>
      <p class="foot">Authorised crew only. Your readings are private and only shared with the mission medical team.</p>
    </div>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    const NEXT = "index.html";

    /* ===== Replace this with your real sign-in (e.g. Supabase) =====
       Must resolve on success and throw an Error(message) on failure.
       Supabase example:
         const {error}=await supabase.auth.signInWithPassword({email,password});
         if(error) throw new Error(error.message);
    */
    async function signIn(email, password, remember) {
      await new Promise(r => setTimeout(r, 700));
      if (password.length < 6) throw new Error("Incorrect email or password.");
      try { (remember ? localStorage : sessionStorage).setItem("oc-user", email) } catch (e) { }
    }

    const setErr = (m, ids = []) => { $("err").textContent = m;["email", "pw"].forEach(i => $(i).setAttribute("aria-invalid", ids.includes(i))) };
    $("eye").addEventListener("click", () => {
      const show = $("pw").type === "password";
      $("pw").type = show ? "text" : "password";
      $("eye").textContent = show ? "Hide" : "Show";
      $("eye").setAttribute("aria-pressed", show);
      $("eye").setAttribute("aria-label", show ? "Hide password" : "Show password");
    });
    $("forgot").addEventListener("click", e => { e.preventDefault(); setErr("Contact your mission administrator to reset your password.") });
    ["email", "pw"].forEach(i => $(i).addEventListener("input", () => setErr("")));
    $("form").addEventListener("submit", async e => {
      e.preventDefault();
      const email = $("email").value.trim(), pw = $("pw").value;
      if (!/^\S+@\S+\.\S+$/.test(email)) { setErr("Enter a valid email address.", ["email"]); $("email").focus(); return }
      if (!pw) { setErr("Enter your password.", ["pw"]); $("pw").focus(); return }
      const b = $("go"); b.disabled = true; b.textContent = "Signing in…"; setErr("");
      try { await signIn(email, pw, $("rem").checked); location.href = NEXT }
      catch (err) { setErr(err.message || "Something went wrong. Please try again.", ["email", "pw"]); b.disabled = false; b.textContent = "Sign in" }
    });
  </script>
</body>

</html>

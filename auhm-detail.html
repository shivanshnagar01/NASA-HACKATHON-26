<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbital Care – Details</title>
  <style>
    :root {
      --bg: #050d22;
      --card: rgba(9, 22, 52, .88);
      --line: #1c4fb8;
      --text: #f3f6ff;
      --muted: #8fa6e0;
      --accent: #35a0ff;
      --ok: #3ddc97;
      --low: #ffbe46;
      --high: #ff6b6b;
      --font: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif
    }

    * {
      box-sizing: border-box;
      margin: 0
    }

    body {
      min-height: 100vh;
      color: var(--text);
      font-family: var(--font);
      padding: 16px 22px 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: radial-gradient(900px 500px at 90% -10%, #10306e 0, transparent 60%), radial-gradient(700px 500px at 0 100%, #0d2354 0, transparent 60%), var(--bg)
    }

    header {
      display: flex;
      align-items: center;
      gap: 26px;
      padding-bottom: 14px;
      border-bottom: 1px solid #123a86
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px
    }

    .brand h1 {
      font-size: 1.9rem;
      line-height: 1
    }

    .brand p {
      margin-top: 4px
    }

    .tag {
      padding-left: 26px;
      border-left: 1px solid #1d3a73;
      font-size: .78rem;
      letter-spacing: .14em;
      color: var(--accent);
      line-height: 1.6
    }

    .sp {
      flex: 1
    }

    .mission b {
      display: block;
      font-size: 1.15rem
    }

    .mission span {
      color: #c5d3ff;
      font-size: .95rem
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 24px;
      border: 1px solid #1d6f78;
      border-radius: 999px;
      background: #0a2a3d;
      color: var(--ok);
      font-weight: 600;
      white-space: nowrap
    }

    .status i {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--ok);
      box-shadow: 0 0 10px var(--ok);
      animation: p 2s infinite
    }

    @keyframes p {
      50% {
        opacity: .4
      }
    }

    .shell {
      flex: 1;
      display: grid;
      grid-template-columns: 230px 1fr;
      gap: 18px;
      min-height: 0
    }

    .side {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 12px;
      border: 1px solid #14346f;
      border-radius: 18px;
      background: var(--card);
      align-self: start
    }

    .side a {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 11px 14px;
      border-radius: 12px;
      color: #c9d6ff;
      text-decoration: none;
      transition: background .2s
    }

    .side a:hover {
      background: rgba(53, 160, 255, .12)
    }

    .side a:focus-visible,
    select:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px
    }

    .side a[aria-current=page] {
      background: linear-gradient(90deg, #1a6dff, #1348b8);
      color: #fff;
      box-shadow: 0 0 18px rgba(40, 110, 255, .55)
    }

    .side svg {
      width: 26px;
      height: 26px;
      flex: none
    }

    .motto {
      margin-top: 18px;
      padding: 10px 14px;
      font-size: .72rem;
      letter-spacing: .18em;
      color: var(--accent);
      line-height: 1.9;
      border-top: 1px solid #14346f
    }

    .content {
      display: grid;
      grid-template-columns: minmax(300px, 1fr) 1.25fr;
      gap: 18px;
      align-content: start;
      min-width: 0
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--card);
      padding: 22px;
      box-shadow: 0 0 26px rgba(30, 90, 255, .16), inset 0 0 30px rgba(30, 90, 255, .06);
      min-width: 0
    }

    .recs {
      grid-column: 1/-1
    }

    .head {
      display: flex;
      align-items: center;
      gap: 12px
    }

    .head h2 {
      font-size: 1.25rem;
      letter-spacing: .04em;
      text-transform: uppercase
    }

    .head p {
      color: var(--muted);
      font-size: .92rem
    }

    .head svg {
      width: 34px;
      height: 34px
    }

    .now .body {
      display: flex;
      align-items: center;
      justify-content: space-around;
      gap: 16px;
      flex-wrap: wrap;
      margin: 14px 0
    }

    .ring {
      position: relative;
      width: 170px;
      height: 170px
    }

    .ring svg {
      width: 100%;
      height: 100%
    }

    .ring .ico {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center
    }

    .ring .ico svg {
      width: 62px;
      height: 62px
    }

    .big {
      text-align: center
    }

    .big .v {
      font-size: clamp(3rem, 6vw, 4.4rem);
      font-weight: 800;
      line-height: 1
    }

    .big .u {
      font-size: 1.2rem;
      color: #d4deff;
      margin: 4px 0 14px
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 10px 34px;
      border: 2px solid var(--c);
      border-radius: 999px;
      color: var(--c);
      font-weight: 700;
      font-size: 1.3rem;
      letter-spacing: .06em;
      background: color-mix(in srgb, var(--c) 12%, transparent);
      box-shadow: 0 0 16px color-mix(in srgb, var(--c) 45%, transparent)
    }

    .pill i {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--c)
    }

    .ok {
      --c: var(--ok)
    }

    .low {
      --c: var(--low)
    }

    .high {
      --c: var(--high)
    }

    .big .r {
      margin-top: 12px;
      font-size: .92rem
    }

    .foot {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      border-top: 1px solid #163a80;
      padding-top: 14px
    }

    .foot div {
      padding: 0 12px;
      border-left: 1px solid #163a80
    }

    .foot div:first-child {
      border: 0;
      padding-left: 0
    }

    .foot small {
      display: block;
      color: var(--muted);
      font-size: .8rem
    }

    .foot b {
      font-size: 1.1rem
    }

    .hist .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px
    }

    select {
      background: #0b1e46;
      color: var(--text);
      border: 1px solid #1e4aa3;
      border-radius: 10px;
      padding: 9px 14px;
      font: inherit
    }

    .chart {
      width: 100%;
      height: auto;
      margin-top: 8px;
      overflow: visible
    }

    .chart text {
      fill: #c6d4ff;
      font-size: 11px
    }

    .chart .g {
      stroke: #17315f;
      stroke-width: 1
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      margin-top: 10px;
      border: 1px solid #163a80;
      border-radius: 14px;
      padding: 12px 6px;
      background: rgba(8, 20, 48, .6)
    }

    .stats div {
      padding: 0 14px;
      border-left: 1px solid #163a80
    }

    .stats div:first-child {
      border: 0
    }

    .stats small {
      display: block;
      color: #c0ceff;
      font-size: .8rem
    }

    .stats b {
      font-size: 1.2rem
    }

    .hint {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 16px
    }

    .hint span {
      font-size: .78rem;
      letter-spacing: .14em;
      color: var(--accent)
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px 28px
    }

    .rec {
      display: flex;
      gap: 16px;
      align-items: flex-start
    }

    .rec .c {
      flex: none;
      width: 62px;
      height: 62px;
      border-radius: 50%;
      border: 1.5px solid #1f66d6;
      display: grid;
      place-items: center;
      color: #5cc2ff;
      background: #0a1f4a;
      box-shadow: 0 0 14px rgba(40, 120, 255, .35)
    }

    .rec .c svg {
      width: 30px;
      height: 30px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .rec h3 {
      font-size: 1.02rem;
      margin-bottom: 4px
    }

    .rec p {
      color: #b9c8f5;
      font-size: .9rem;
      line-height: 1.45
    }

    @media (max-width:1100px) {
      .shell {
        grid-template-columns: 1fr
      }

      .side {
        flex-direction: row;
        overflow-x: auto;
        align-self: stretch
      }

      .side a {
        white-space: nowrap
      }

      .motto {
        display: none
      }

      .tag,
      .mission {
        display: none
      }
    }

    @media (max-width:860px) {
      .content {
        grid-template-columns: 1fr
      }

      .grid {
        grid-template-columns: 1fr 1fr
      }
    }

    @media (max-width:560px) {
      body {
        padding: 12px
      }

      .grid {
        grid-template-columns: 1fr
      }

      .status {
        padding: 8px 14px;
        font-size: .85rem
      }

      .brand h1 {
        font-size: 1.4rem
      }

      .pill {
        padding: 8px 22px;
        font-size: 1.1rem
      }

      .foot small {
        font-size: .7rem
      }

      .foot div {
        padding: 0 6px
      }
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="brand">
      <svg width="64" height="64" viewBox="0 0 72 72" fill="none" stroke="#6f9bff" stroke-width="3.5"
        aria-hidden="true">
        <circle cx="36" cy="36" r="17" fill="#16306e" />
        <ellipse cx="36" cy="38" rx="32" ry="11" transform="rotate(-25 36 38)" />
      </svg>
      <div>
        <h1>AUHM</h1>
        <p>Astronaut Universal Health Monitor</p>
      </div>
    </div>
    <div class="tag">MONITOR TODAY.<br>EXPLORE TOMORROW.</div>
    <div class="sp"></div>
    <div class="mission"><b id="day"></b><span id="clock"></span></div>
    <div class="status" role="status"><i></i>System Online</div>
  </header>

  <div class="shell">
    <nav class="side" id="nav" aria-label="Parameters"></nav>
    <main class="content">
      <section class="card now" id="now" aria-live="polite"></section>
      <section class="card hist">
        <div class="top">
          <div class="head"><svg viewBox="0 0 24 24" fill="#35a0ff" aria-hidden="true">
              <rect x="3" y="12" width="4" height="9" rx="1" />
              <rect x="10" y="5" width="4" height="16" rx="1" />
              <rect x="17" y="9" width="4" height="12" rx="1" />
            </svg>
            <h2 id="hTitle"></h2>
          </div>
          <select id="range" aria-label="Time range"></select>
        </div>
        <svg class="chart" id="chart" viewBox="0 0 640 270" role="img"></svg>
        <div class="stats" id="stats"></div>
      </section>
      <section class="card recs" id="recs"></section>
    </main>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const I = {
      hr: '<svg viewBox="0 0 40 40"><path d="M20 35C8 26 3 19 3 13a8.5 8.5 0 0 1 17-2 8.5 8.5 0 0 1 17 2c0 6-5 13-17 22z" fill="#ff3b4e"/></svg>',
      bp: '<svg viewBox="0 0 40 40" fill="none" stroke="#35b6ff" stroke-width="3" stroke-linecap="round"><path d="M6 28a15 15 0 1 1 28 0"/><path d="M20 24l7-9"/><circle cx="20" cy="25" r="2.5" fill="#35b6ff"/></svg>',
      bs: '<svg viewBox="0 0 40 40"><path d="M20 3C14 13 8 19 8 26a12 12 0 0 0 24 0C32 19 26 13 20 3z" fill="#ffa726"/><path d="M14 27a6 6 0 0 0 5 6" stroke="#7a3d00" stroke-width="3" fill="none" stroke-linecap="round"/></svg>',
      bt: '<svg viewBox="0 0 40 40" fill="none" stroke="#2ec4ff" stroke-width="3" stroke-linecap="round"><rect x="14" y="3" width="12" height="25" rx="6"/><circle cx="20" cy="31" r="6" fill="#2ec4ff"/><path d="M20 12v16"/></svg>',
      sh: '<svg viewBox="0 0 40 40" fill="#b07cff"><rect x="3" y="6" width="3.5" height="28" rx="1"/><rect x="3" y="26" width="34" height="3.5" rx="1"/><rect x="9" y="17" width="9" height="7" rx="3"/><path d="M21 19h13a3 3 0 0 1 3 3v4H21z"/></svg>',
      sq: '<svg viewBox="0 0 40 40"><path d="M26 5a15 15 0 1 0 9 26A12 12 0 0 1 26 5z" fill="#a88bff"/></svg>',
      st: '<svg viewBox="0 0 40 40"><path d="M23 2L8 22h10l-4 16 18-23H21z" fill="#ffc21a"/></svg>'
    };
    const home = '<svg viewBox="0 0 40 40" fill="#5b9dff"><path d="M20 5L4 19h5v14h8v-9h6v9h8V19h5z"/></svg>';
    const R = {
      meal: '<path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 21V3c-3 2-4 6-4 9h4"/>',
      water: '<path d="M12 3c4 5 6 8 6 11a6 6 0 0 1-12 0c0-3 2-6 6-11z"/>',
      run: '<circle cx="14" cy="4.5" r="2"/><path d="M8 21l3-6 3 2v5M11 15l-1-5 4-2 3 4h3M7 11l3-3"/>',
      bowl: '<path d="M3 12h18a9 9 0 0 1-18 0zM8 12c0-3 2-5 4-5M14 7c2 0 4 1 4 5"/>',
      sleep: '<path d="M20 14A8 8 0 1 1 10 4a6.5 6.5 0 0 0 10 10z"/>',
      report: '<path d="M6 3h8l4 4v14H6zM14 3v4h4M12 11v6M9 14h6"/>',
      heart: '<path d="M12 20C5 15 3 11 3 8a4.5 4.5 0 0 1 9-1 4.5 4.5 0 0 1 9 1c0 3-2 7-9 12z"/>',
      temp: '<path d="M10 14V5a2 2 0 0 1 4 0v9a4 4 0 1 1-4 0z"/>',
      calm: '<path d="M12 21c-5-3-8-7-8-11 3 0 6 1 8 4 2-3 5-4 8-4 0 4-3 8-8 11z"/>'
    };
    /* ===== EDIT HERE: one object per parameter. The page renders everything from this. ===== */
    const P = {
      hr: {
        name: "Heart Rate", tag: "Keep your rhythm steady", unit: "bpm", dec: 0, base: 70, amp: 8, lo: 60, hi: 100, min: 40, max: 140, step: 20, range: "60 – 100 bpm", recs: [
          ["calm", "Practise Calm Breathing", "Slow, deep breaths help bring a raised heart rate back to baseline."],
          ["run", "Exercise Regularly", "Short daily cardio sessions keep the heart strong in microgravity."],
          ["water", "Stay Hydrated", "Dehydration makes the heart work harder. Drink at set intervals."],
          ["sleep", "Protect Your Sleep", "Aim for 7–8 hours so your resting heart rate can recover."],
          ["meal", "Limit Stimulants", "Keep caffeine low, especially in the hours before sleep."],
          ["report", "Report Irregular Rhythm", "Tell the medical team about palpitations, dizziness or chest discomfort."]]
      },
      bp: {
        name: "Blood Pressure", tag: "Keep the pressure in balance", unit: "mmHg", dec: 0, base: 116, amp: 6, lo: 90, hi: 130, min: 60, max: 160, step: 20, range: "90 – 130 mmHg (systolic)", fmt: v => Math.round(v) + "/" + Math.round(v * .66), recs: [
          ["meal", "Watch Your Sodium", "Choose low-sodium meals; salt raises pressure and fluid retention."],
          ["water", "Stay Hydrated", "Steady fluid intake supports healthy blood volume."],
          ["run", "Exercise Regularly", "Resistance and cardio sessions help counter fluid shifts in space."],
          ["calm", "Manage Stress", "Short relaxation breaks through the day keep pressure steady."],
          ["sleep", "Get Adequate Sleep", "Poor sleep is linked to higher blood pressure."],
          ["report", "Report Sudden Changes", "Inform the medical team about headaches, blurred vision or dizziness."]]
      },
      bs: {
        name: "Blood Sugar", tag: "Keep your energy in balance", unit: "mg/dL", dec: 0, base: 102, amp: 14, lo: 70, hi: 140, min: 0, max: 250, step: 50, range: "70 – 140 mg/dL", recs: [
          ["meal", "Follow Meal Schedule", "Maintain a consistent meal timing to keep blood sugar levels stable."],
          ["water", "Stay Hydrated", "Drink enough water to support metabolism and overall health in microgravity."],
          ["run", "Exercise Regularly", "Daily physical activity helps regulate blood sugar and improves insulin sensitivity."],
          ["bowl", "Monitor Carbohydrate Intake", "Choose complex carbohydrates and balanced meals to avoid sudden spikes."],
          ["sleep", "Get Adequate Sleep", "Aim for 7–8 hours of quality sleep to support hormone balance and glucose control."],
          ["report", "Report Sudden Changes", "Inform the medical team if you notice unusually high or low blood sugar levels."]]
      },
      bt: {
        name: "Body Temperature", tag: "Stay in your comfort zone", unit: "°C", dec: 1, base: 36.7, amp: .3, lo: 36.1, hi: 37.5, min: 35, max: 39, step: 1, range: "36.1 – 37.5 °C", recs: [
          ["water", "Stay Hydrated", "Fluids help the body regulate heat when cooling is limited."],
          ["temp", "Check Suit Cooling", "Adjust cooling settings so you stay comfortable during activity."],
          ["meal", "Eat Regularly", "Steady meals support a stable core temperature."],
          ["sleep", "Rest Well", "Sleep in a cool, ventilated area of the module."],
          ["run", "Cool Down After Exercise", "Allow time to cool down to avoid overheating."],
          ["report", "Report Fever or Chills", "Inform the medical team if your temperature leaves the normal range."]]
      },
      sh: {
        name: "Daily Sleep Hours", tag: "Rest to perform at your best", unit: "hrs", dec: 1, base: 7.3, amp: .8, lo: 7, hi: 9, min: 0, max: 12, step: 3, range: "7 – 9 hrs", daily: 1, recs: [
          ["sleep", "Keep a Fixed Schedule", "Go to bed and wake up at the same time to stay in sync with mission time."],
          ["calm", "Wind Down Early", "Dim lights and avoid screens for 30 minutes before sleep."],
          ["meal", "Mind Late Meals", "Avoid heavy meals and caffeine close to bedtime."],
          ["run", "Exercise Earlier", "Finish hard workouts a few hours before sleep."],
          ["temp", "Cool, Dark Sleep Area", "Use an eye mask and keep the sleep station comfortably cool."],
          ["report", "Report Poor Sleep", "Tell the medical team if you sleep under 6 hours for several days."]]
      },
      sq: {
        name: "Sleep Quality", tag: "Wake up recovered", unit: "%", dec: 0, base: 82, amp: 8, lo: 70, hi: 100, min: 0, max: 100, step: 25, range: "70 – 100 %", daily: 1, recs: [
          ["sleep", "Consistent Bedtime", "A regular routine improves deep and REM sleep."],
          ["calm", "Relax Before Bed", "Try breathing exercises or light stretching."],
          ["water", "Limit Evening Fluids", "Fewer night-time interruptions mean more restful sleep."],
          ["run", "Stay Active by Day", "Daily movement helps you fall asleep faster."],
          ["heart", "Check Your Heart Rate", "A calm resting heart rate often goes with better sleep."],
          ["report", "Report Restless Nights", "Inform the medical team if poor quality continues."]]
      },
      st: {
        name: "Stress Level", tag: "Stay calm and focused", unit: "/ 10", dec: 1, base: 3.2, amp: 1.4, lo: 0, hi: 6, min: 0, max: 10, step: 2, range: "0 – 6 / 10", recs: [
          ["calm", "Breathe and Reset", "Take a few slow breaths between tasks to lower tension."],
          ["run", "Move Your Body", "Exercise releases tension and lifts your mood."],
          ["heart", "Stay Connected", "Schedule regular calls with family and friends."],
          ["sleep", "Protect Your Rest", "Good sleep makes it easier to handle pressure."],
          ["bowl", "Eat Well", "Balanced meals support steady energy and mood."],
          ["report", "Ask for Support", "Talk to the flight surgeon or psychologist if stress stays high."]]
      }
    };
    /* ===== end of data ===== */
    const RANGES = [["Last 24 Hours", 24], ["Last 12 Hours", 12], ["Last 6 Hours", 6]];
    const MISSION_START = Date.UTC(2026, 6, 8);
    const rng = s => { let a = 0; for (const c of s) a = Math.imul(a ^ c.charCodeAt(0), 16777619); return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296 } };
    const S = { key: "bs", hours: 24, series: [], cur: 0, prev: 0, at: new Date() };
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
    const fv = v => { const p = P[S.key]; return p.fmt ? p.fmt(v) : v.toFixed(p.dec) };
    const hhmm = d => d.toISOString().slice(11, 16);
    function status(v) { const p = P[S.key]; return v < p.lo ? ["Low", "low"] : v > p.hi ? ["High", "high"] : ["Normal", "ok"] }
    function build() {
      const p = P[S.key], n = p.daily ? 7 : 25, r = rng(S.key + (p.daily ? 7 : S.hours)), ph = r() * 6;
      const f = p.daily ? 2 : S.hours === 6 ? .6 : S.hours === 12 ? 1.1 : 1.8;
      S.series = Array.from({ length: n }, (_, i) => clamp(p.base + p.amp * (Math.sin(i / n * 6.28 * f + ph) * .7 + (r() - .5) * .5), p.min, p.max));
      if (!S.fresh) { S.cur = S.series[n - 1]; S.prev = S.series[n - 2] }
      S.series[n - 1] = S.cur;
    }
    function renderNow() {
      const p = P[S.key], [st, cl] = status(S.cur), d = S.cur - S.prev, steady = Math.abs(d) <= p.amp * .12;
      const frac = clamp((S.cur - p.min) / (p.max - p.min), 0, 1), C = 2 * Math.PI * 62;
      const arrow = d > 0 ? '<path d="M12 20V6M6 12l6-6 6 6"/>' : '<path d="M12 4v14M6 12l6 6 6-6"/>';
      $("now").innerHTML = `<div class="head">${I[S.key]}<div><h2>${p.name}</h2><p>${p.tag}</p></div></div>
  <div class="body"><div class="ring ${cl}"><svg viewBox="0 0 160 160" aria-hidden="true"><circle cx="80" cy="80" r="62" fill="none" stroke="#14294f" stroke-width="10"/><circle cx="80" cy="80" r="62" fill="none" stroke="var(--c)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${frac * C} ${C}" transform="rotate(-90 80 80)" style="filter:drop-shadow(0 0 6px var(--c))"/></svg><div class="ico">${I[S.key]}</div></div>
  <div class="big ${cl}"><div class="v">${fv(S.cur)}</div><div class="u">${p.unit}</div><div class="pill"><i></i>${st.toUpperCase()}</div><div class="r">Normal range: ${p.range}</div></div></div>
  <div class="foot"><div><small>Last Reading</small><b>${hhmm(S.at)} UTC</b></div>
  <div><small>Trend</small><b>${steady ? "±" : d > 0 ? "+" : "−"}${Math.abs(d).toFixed(p.dec)} ${p.unit}</b></div>
  <div><small>Status</small><b>${steady ? "Stable" : d > 0 ? "Rising" : "Falling"}</b></div></div>`;
    }
    function renderChart() {
      const p = P[S.key], n = S.series.length, W = 640, H = 270, L = 52, Rr = 64, T = 12, B = 30;
      const x = i => L + i * (W - L - Rr) / (n - 1), y = v => T + (H - T - B) * (1 - (clamp(v, p.min, p.max) - p.min) / (p.max - p.min));
      let g = "";
      for (let v = p.min; v <= p.max + 1e-9; v += p.step)g += `<line class="g" x1="${L}" x2="${W - Rr}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${+v.toFixed(1)}</text>`;
      const pts = S.series.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
      const now = Date.now(); let xl = "";
      if (p.daily) for (let i = 0; i < n; i++)xl += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${i == n - 1 ? "Today" : new Date(now - (n - 1 - i) * 864e5).toUTCString().slice(0, 3)}</text>`;
      else for (let i = 0; i <= 24; i += 4)xl += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${hhmm(new Date(now - S.hours * 36e5 * (1 - i / 24)))}</text>`;
      const dots = S.series.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="3.2" fill="#35d0ff"><title>${fv(v)} ${p.unit}</title></circle>`).join("");
      $("chart").setAttribute("aria-label", `${p.name} history chart`);
      $("chart").innerHTML = `<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#35d0ff" stop-opacity=".35"/><stop offset="1" stop-color="#35d0ff" stop-opacity="0"/></linearGradient></defs>${g}
  <line x1="${L}" x2="${L}" y1="${T}" y2="${H - B}" stroke="#2a4a8a"/><text transform="rotate(-90 12 ${H / 2})" x="12" y="${H / 2}" text-anchor="middle" style="font-size:10px">${p.name} (${p.unit})</text>
  <line x1="${L}" x2="${W - Rr}" y1="${y(p.hi)}" y2="${y(p.hi)}" stroke="var(--high)" stroke-dasharray="5 4"/><line x1="${L}" x2="${W - Rr}" y1="${y(p.lo)}" y2="${y(p.lo)}" stroke="var(--ok)" stroke-dasharray="5 4"/>
  <text x="${W - Rr + 10}" y="${y(p.hi) + 14}" style="fill:var(--high)">High</text><text x="${W - Rr + 10}" y="${y((p.hi + p.lo) / 2)}" style="fill:var(--ok)">Normal</text><text x="${W - Rr + 10}" y="${y(p.lo) - 6}" style="fill:var(--low)">Low</text>
  <polygon points="${x(0)},${H - B} ${pts} ${x(n - 1)},${H - B}" fill="url(#ag)"/><polyline points="${pts}" fill="none" stroke="#35d0ff" stroke-width="2.5" stroke-linejoin="round"/>${dots}${xl}`;
      const avg = S.series.reduce((a, b) => a + b, 0) / n, mx = Math.max(...S.series), mn = Math.min(...S.series);
      const ar = (c, u) => `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-4px;margin-right:6px">${u ? '<path d="M12 20V5M6 11l6-6 6 6"/>' : '<path d="M12 4v15M6 13l6 6 6-6"/>'}</svg>`;
      const lab = p.daily ? "Average (7d)" : "Average (" + S.hours + "h)";
      $("stats").innerHTML = `<div><small>${lab}</small><b>${fv(avg)} ${p.unit}</b></div><div><small>Maximum</small><b>${ar("#ff6b6b", 1)}${fv(mx)} ${p.unit}</b></div><div><small>Minimum</small><b>${ar("#3ddc97", 0)}${fv(mn)} ${p.unit}</b></div>`;
    }
    function renderRecs() {
      const p = P[S.key];
      $("recs").innerHTML = `<div class="hint"><div class="head"><svg viewBox="0 0 24 24" fill="#ffd54a" aria-hidden="true"><path d="M12 2a7 7 0 0 0-4 12.7V18h8v-3.3A7 7 0 0 0 12 2zM9 20h6v2H9z"/></svg><h2>${p.name} Recommendations</h2></div><span>TAKE CARE. STAY MISSION-READY.</span></div>
  <div class="grid">${p.recs.map(r => `<div class="rec"><div class="c"><svg viewBox="0 0 24 24" aria-hidden="true">${R[r[0]]}</svg></div><div><h3>${r[1]}</h3><p>${r[2]}</p></div></div>`).join("")}</div>`;
    }
    function renderNav() {
      $("nav").innerHTML = `<a href="index.html">${home}<span>Home</span></a>` + Object.keys(P).map(k => `<a href="#${k}" ${k === S.key ? 'aria-current="page"' : ""}>${I[k]}<span>${P[k].name}</span></a>`).join("") + `<div class="motto">HEALTHY ASTRONAUTS<br>BRIGHTER TOMORROWS</div>`;
    }
    function setRange() {
      const p = P[S.key], sel = $("range");
      sel.innerHTML = p.daily ? '<option>Last 7 Days</option>' : RANGES.map(r => `<option value="${r[1]}"${r[1] === S.hours ? " selected" : ""}>${r[0]}</option>`).join("");
      sel.disabled = !!p.daily;
    }
    function load() {
      const h = location.hash.slice(1); S.key = P[h] ? h : "bs"; S.fresh = false; S.at = new Date();
      document.title = `Orbital Care – ${P[S.key].name}`; $("hTitle").textContent = P[S.key].name + " History";
      setRange(); build(); S.fresh = true; renderNav(); renderNow(); renderChart(); renderRecs();
    }
    $("range").addEventListener("change", e => { S.hours = +e.target.value; build(); renderChart() });
    addEventListener("hashchange", load);
    function clock() {
      const d = new Date(); $("day").textContent = "Mission Day " + (Math.floor((d - MISSION_START) / 864e5) + 1);
      $("clock").textContent = d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric", timeZone: "UTC" }) + "  |  " + hhmm(d) + " UTC"
    }
    setInterval(clock, 1000); clock();
    setInterval(() => { const p = P[S.key]; S.prev = S.cur; S.cur = clamp(S.cur + (Math.random() - .5) * p.amp * .35, p.min, p.max); S.at = new Date(); S.series[S.series.length - 1] = S.cur; renderNow(); renderChart() }, 5000);
    load();
  </script>
</body>

</html>
